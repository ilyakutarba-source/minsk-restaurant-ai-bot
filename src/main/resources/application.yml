spring:
  autoconfigure:
    exclude: org.springframework.ai.model.chat.memory.autoconfigure.ChatMemoryAutoConfiguration
  application:
    name: minsk-restaurant-ai-bot
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    retry:
      max-attempts: 1
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never

  flyway:
    locations: classpath:db/migration,classpath:db/memory/{vendor}

  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# REST and Swagger are local demo interfaces (see docs/DEPLOYMENT.md).
server:
  address: 127.0.0.1

restaurant-bot:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${AIAI_API_KEY:}
    explanation-enabled: true

# Provider error bodies and request payloads must not enter ordinary logs.
logging:
  level:
    org.springframework.ai: "OFF"
    org.apache.hc.client5.http: "OFF"
    org.apache.hc.core5.http: "OFF"
    com.pengrad.telegrambot: "OFF"
    okhttp3: "OFF"
    # Pengrad's shutdown race can fall back to JUL Logger.getGlobal() without our handler.
    global: "OFF"
