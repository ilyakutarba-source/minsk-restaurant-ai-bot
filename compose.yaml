name: minsk-restaurant-ai-bot

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    scale: 1
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      AI_ENABLED: ${AI_ENABLED:-false}
      AIAI_API_KEY: ${AIAI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:?Choose a free loopback port}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Existing Java catalog endpoint verifies HTTP and a real DB read, without AI.
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "--max-time", "5", "http://127.0.0.1:8080/api/v1/restaurants?size=1"]
      interval: 30s
      timeout: 6s
      start_period: 90s
      retries: 5
    networks:
      - backend

  postgres:
    image: postgres:17.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - backend

volumes:
  postgres_data:
    # Explicit identity survives a change of Dokploy checkout/container/project name.
    name: ${POSTGRES_VOLUME_NAME:?Set a unique stable PostgreSQL volume name}

networks:
  # Project-scoped bridge, no shared dokploy-network/Traefik; app needs API egress.
  backend:
    driver: bridge
